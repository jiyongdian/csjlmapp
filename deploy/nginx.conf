# CSJLM Studio 反向代理示例（Nginx）
# 适用：Ubuntu/Debian 下 /etc/nginx/sites-available/csjlm.conf
# 1. cp deploy/nginx.conf /etc/nginx/sites-available/csjlm.conf
# 2. 修改 server_name 与证书路径
# 3. ln -s /etc/nginx/sites-available/csjlm.conf /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx

server {
  listen 80;
  server_name your.domain.com;          # 换成你的域名/IP

  client_max_body_size 100m;            # 允许上传大图/音频

  # HTTP -> HTTPS（有证书时启用，否则将这整块去掉）
  location /.well-known/acme-challenge/ { root /var/www/html; }
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name your.domain.com;

  ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 100m;

  location / {
    proxy_pass http://127.0.0.1:5000;   # 与 DEPLOY_RUN_PORT 保持一致
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE（章节流式生成）与 WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}